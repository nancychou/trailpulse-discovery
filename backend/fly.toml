# fly.toml app configuration file generated for trailpulse-api on 2026-02-20T11:38:16-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trailpulse-api'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '2s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 2
